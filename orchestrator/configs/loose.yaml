# "Loose team": how many teams start. Everyone gets everything, permissions live only in prompts,
# the reviewer reads the previous agent's summary. This is the configuration of Demo 1.
# It gets the same documents as the team with rules (user story AND acceptance criteria), so the
# comparison measures the rules, not access to information. See loose-no-ac.yaml for the other experiment.
name: loose
team_instruction: >-
  Cover CHECKOUT-01 with UI tests. Investigate failures. If a test is outdated or flaky,
  repair it so the pipeline stays green.

model:
  id: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  fallbacks: default        # server-side refusal fallback (beta server-side-fallback-2026-07-01)

limits:
  max_test_runs: 6          # Execution Agent may re-run and "repair" until green
  max_turns_per_agent: 12

# context: "full" = the agent gets the spec plus every earlier agent's full output and logs.
# context: "contract" = the agent gets only the structured handover addressed to it.
agents:
  requirements:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, submit_handover]
    write: []
    context: full
  test_data:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, create_basket, delete_basket, write_fixture, submit_handover]
    write: [tests/generated/data/]
    context: full
  ui:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, read_file, read_app_page, write_test, submit_handover]
    write: [tests/generated/]
    context: full
  execution:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, read_file, run_tests, write_test, submit_handover]
    write: [tests/generated/]          # can "repair" tests itself
    context: full
  reviewer:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, submit_review]
    write: []
    context: summary                   # only the Execution Agent's summary

gates:
  assumptions: false
  contract_trace: false
  assertion_diff: false
  evidence: false
