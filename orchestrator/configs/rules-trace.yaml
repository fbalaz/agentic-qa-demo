# "Team with rules" plus one permission: the Reviewer may read the page snapshot Playwright writes when a
# test fails (error-context.md in this run's output). Everything else is identical to rules.yaml.
# Experiment after the 2026-11-08 measurements: in run 20261108-121638-loose the Reviewer wrote
# "unconfirmed, open the traces" and could not. Does seeing the page change its verdict?
name: rules-trace
team_instruction: >-
  Cover CHECKOUT-01 with UI tests. Investigate failures. If a test is outdated or flaky,
  repair it so the pipeline stays green.

model:
  id: claude-opus-5-5
  effort: medium
  max_tokens: 16000
  fallbacks: default

limits:
  max_test_runs: 2
  max_turns_per_agent: 12

agents:
  requirements:
    docs: [user-story, acceptance-criteria]
    tools: [read_doc, submit_handover]
    write: []
    context: contract
  test_data:
    docs: []
    tools: [create_basket, delete_basket, write_fixture, submit_handover]
    write: [tests/generated/data/]
    context: contract
  ui:
    docs: []
    tools: [read_file, read_app_page, write_test, submit_handover]
    write: [tests/generated/]
    context: contract
  execution:
    docs: []
    tools: [read_file, run_tests, write_test, propose_patch, submit_handover]
    write: []
    context: contract
  reviewer:
    docs: [acceptance-criteria]
    tools: [read_doc, read_file, submit_review]
    write: []
    read: [run-output]                 # the one difference: page snapshots of failed tests
    context: evidence

gates:
  assumptions: true
  contract_trace: true
  assertion_diff: true
  evidence: true
